name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 because generate_agent_surface.py derives each page's
      # <lastmod> for sitemap.xml from `git log -1 --format=%cs -- <path>`. In
      # the default depth-1 clone there is no per-file history, so every entry
      # would silently fall back to the build date.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The site runs as plain static files at the repo root — index.html
      # uses an importmap to load maplibre-gl and @duckdb/duckdb-wasm from
      # esm.sh at runtime, so there is no bundle step. Stage just the
      # front-end assets so we don't ship the data pipeline / agent specs
      # as part of the live site.
      - name: Stage static site
        run: |
          set -eu
          mkdir -p _site
          cp index.html _site/
          cp favicon.svg _site/ 2>/dev/null || true
          cp -R src _site/src
          cp -R public _site/public
          # Human-authored markdown lives at /docs/ in the repo and is
          # rendered by src/views/docs.js. Without this stage step the
          # Docs tab returns HTTP 404 for every page.
          cp -R docs _site/docs

      # Agent surface: robots.txt, sitemap.xml, llms.txt, llms-full.txt and
      # public/parquet/schema.json. duckdb is needed only to read column names,
      # types and row counts out of the staged Parquet files — without it the
      # generator still writes every output, minus the column lists and
      # schema.json. --strict fails the build on documentation drift (a page in
      # docs/ that is missing from DOC_META in the generator or from DOC_PAGES
      # in src/views/docs.js, or a new Parquet table that no group claims).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate the agent surface (llms.txt, robots.txt, sitemap.xml)
        run: |
          set -eu
          pip install --quiet duckdb
          python3 scripts/generate_agent_surface.py _site --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
