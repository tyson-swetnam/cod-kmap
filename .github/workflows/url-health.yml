name: URL health check

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# The PR step also needs the repo setting "Allow GitHub Actions to create
# and approve pull requests" (Settings -> Actions -> General).

concurrency:
  group: url-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # duckdb 2.0 needs Python >= 3.11.
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The DuckLake store (db/cod_kmap_catalog.sqlite + db/lake/) is
      # gitignored local state; every run rebuilds it from the committed
      # db/parquet. The ducklake/sqlite extensions are fetched from
      # extensions.duckdb.org on first use.
      - name: Rebuild DuckLake from committed parquet
        run: python scripts/rebuild_lake_from_parquet.py --parquet db/parquet
      - name: HTTP HEAD every URL
        run: python scripts/check_url_health.py --concurrency 16 --timeout 8
      - name: Clear homepages that are facility landing pages
        run: python scripts/url_hygiene.py
      - name: Run QA
        run: python scripts/qa.py
      - name: Re-export parquet
        run: python scripts/export_parquet.py
      # Not peter-evans/create-pull-request: db/parquet/*.parquet and
      # public/parquet/*.parquet are gitignored-but-tracked, and a plain
      # `git add` (which that action runs) silently skips a NEW ignored file
      # such as the first url_health.parquet. Stage with `git add -f`.
      - name: Open URL-health PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: url-health/${{ github.run_id }}
        run: |
          set -eu
          git add -f db/parquet/*.parquet public/parquet/*.parquet
          git add public/facilities.geojson data/seed/url_health_check.csv
          if [ -f data/seed/url_hygiene_log.csv ]; then
            git add data/seed/url_hygiene_log.csv
          fi
          if git diff --cached --quiet; then
            echo "No changes; no PR opened."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "chore(url-health): weekly verification"
          git push origin "$BRANCH"
          gh label create url-health --color 0e8a16 \
            --description "Automated URL health sweep" 2>/dev/null || true
          gh pr create --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "chore(url-health): weekly verification" \
            --label url-health \
            --body "Automated URL verification: \`scripts/check_url_health.py\` (HTTP HEAD, GET fallback) and \`scripts/url_hygiene.py\` (person homepages that are facility landing pages set to NULL), run against a DuckLake rebuilt from the committed db/parquet, gated by \`scripts/qa.py\`, then re-exported by \`scripts/export_parquet.py\`. Review the \`data/seed/url_health_check.csv\` and \`data/seed/url_hygiene_log.csv\` diffs before merging."
